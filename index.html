<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Envoler Follow-ups</title>
<meta name="theme-color" content="#082C50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Envoler">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/app-favicon.png">
<link rel="apple-touch-icon" href="icons/app-touch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --ink:#13233A; --muted:#5B6B80; --line:#D3DDE8;
  --sky:#1F5FA8; --sky-soft:#DCE8F6; --amber:#B07500; --amber-soft:#FDF0D3;
  --red:#B8392A; --red-soft:#F8DEDA; --green:#2C7A55; --green-soft:#DBF0E4;
  --board:#082C50; --board-ink:#F3F6FA; --board-dim:#A3B3C8; --on-sky:#FFFFFF;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1826; --surface:#16233A; --ink:#E7EDF5; --muted:#9AAAC0; --line:#2A3B55;
    --sky:#79AEEB; --sky-soft:#1D3555; --amber:#F0B640; --amber-soft:#3A2F14;
    --red:#EE7F70; --red-soft:#43211D; --green:#6CC79A; --green-soft:#173627;
    --board:#082C50; --board-ink:#F3F6FA; --board-dim:#8597AF; --on-sky:#0E1826;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.cond{font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}

.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:18px 20px 16px}
.board .brand{display:flex;justify-content:space-between;align-items:center;color:var(--board-dim);font-size:14px;gap:8px}
.icon-btn{border:0;background:rgba(255,255,255,.1);color:var(--board-ink);border-radius:10px;width:38px;height:38px;display:inline-grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.board .big{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:clamp(40px,11vw,64px);line-height:1;margin:12px 0 4px}
.board .sub{color:var(--board-dim)}
.board .sub b{color:#FFB4A8;font-weight:600}
.scope{display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;margin-top:14px}
.scope button{border:0;background:transparent;color:var(--board-dim);padding:6px 14px;border-radius:999px;font-size:14px}
.scope button[aria-pressed="true"]{background:var(--board-ink);color:var(--board)}

h2{font-size:24px;font-weight:600;margin:12px 0 10px}
.group-h{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px;font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:18px}
.group-h .n{color:var(--muted);font-weight:500;font-size:15px}
.group-h.overdue{color:var(--red)} .group-h.today{color:var(--amber)}

.row{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:start;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.date{font-family:"Barlow Semi Condensed",sans-serif;text-align:center;border-radius:8px;padding:4px 0;background:var(--sky-soft);color:var(--sky)}
.date .d{font-size:22px;font-weight:700;line-height:1.1;display:block}
.date .m{font-size:13px}
.row.overdue .date{background:var(--red-soft);color:var(--red)}
.row.today .date{background:var(--amber-soft);color:var(--amber)}
.row.done{opacity:.6} .row.done .task{text-decoration:line-through}
.task{font-weight:600;margin:0 0 2px}
.meta{color:var(--muted);font-size:14px}
.acts{display:flex;flex-direction:column;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:500;min-height:40px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--sky);border-color:var(--sky);color:var(--on-sky)}
.btn.ok{border-color:var(--green);color:var(--green)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wide{width:100%;padding:12px;font-size:16px}
.rec{background:var(--red);border-color:var(--red);color:#fff}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);text-align:center;margin-top:16px}
.pending{font-size:12px;color:var(--amber);font-weight:600}

label{display:block;font-size:14px;font-weight:500;color:var(--muted);margin:14px 0 4px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{min-height:180px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h3{margin:0 0 8px;font-size:19px}
.draft-f{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.draft-f:first-of-type{border-top:0;margin-top:0;padding-top:0}
.x{border:0;background:none;color:var(--red);font-size:14px;padding:6px 0}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px}
.check input{width:20px;height:20px}

.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.person summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.person summary::-webkit-details-marker{display:none}
.person .body{padding:0 14px 14px;font-size:15px}
.pill{font-size:13px;border-radius:999px;padding:2px 9px;background:var(--sky-soft);color:var(--sky);white-space:nowrap;align-self:center}
.pill.warn{background:var(--red-soft);color:var(--red)}
.note{white-space:pre-wrap;font-size:15px;background:var(--bg);border-radius:8px;padding:10px;max-height:260px;overflow:auto}
ul.plain{padding-left:18px;margin:6px 0}
.banner{background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.banner .btn{margin-top:8px}

.signin{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.signin .board{padding:28px 22px}
.signin p{color:var(--board-dim);margin:8px 0 20px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border:0;border-radius:12px;padding:13px;font-weight:600;font-size:16px}

.reccard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.reccard .btn{margin-top:8px}
.btn.record{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.live{display:flex;align-items:center;gap:10px;font-family:"Barlow Semi Condensed",sans-serif;font-size:22px;font-weight:600;color:var(--red)}
.live .dot{width:12px;height:12px;border-radius:50%;background:var(--red)}
@media (prefers-reduced-motion:no-preference){ .live .dot{animation:blink 1.2s infinite} @keyframes blink{50%{opacity:.25}} }
.tstatus{font-size:14px;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--sky-soft);color:var(--ink)}
.tstatus.warn{background:var(--amber-soft)}
.upload input{display:none}
.signin select,.signin input{color:var(--ink);background:var(--surface)}
.signin-logo{display:block;width:100%;max-width:340px;border-radius:12px;margin:0 auto 18px}
.kv{font-size:15px;margin:6px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:720px}
nav.tabs button{border:0;background:none;padding:10px 2px 12px;font-size:13px;white-space:nowrap;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--sky);font-weight:600}
nav.tabs[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:15px;z-index:9;max-width:90vw;text-align:center}
@media (max-width:420px){ .row{grid-template-columns:52px 1fr} .acts{grid-column:1/-1;flex-direction:row} .acts .btn{flex:1} }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<nav class="tabs" id="tabs" aria-label="Sections" hidden><div class="in">
  <button data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Follow-ups</button>
  <button data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>Log meeting</button>
  <button data-v="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"/></svg>People</button>
  <button data-v="meetings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h6"/></svg>Meetings</button>
</div></nav>

<script>
(() => {
"use strict";
const CFG = Object.assign({TEAM:[],TIME_ZONE:"Asia/Kolkata",REMINDER_TIME:"10:00",CLAUDE_MODEL:"claude-sonnet-5-5"}, window.ENVOLER_CONFIG||{});
if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(CFG.API_URL||"")) CFG.API_URL="";
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = s => { if(!s) return ""; const d=new Date(s+"T00:00:00"); return isNaN(d)?s:`${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const key = (n,o) => String(n||"").trim().toLowerCase()+"|"+String(o||"").trim().toLowerCase();
const LS = {
  get(k,d){ try{ const v=localStorage.getItem("env_"+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("env_"+k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("env_"+k); }catch(e){} }
};
const blankDraft = () => ({person:"",org:"",date:today(),notes:"",summary:"",decisions:[],items:[]});

const S = {
  view:"today", scope:"mine",
  me:LS.get("me",null), pin:LS.get("pin",""), info:LS.get("info",null),
  meetings:LS.get("cache",{}).meetings||[], followups:LS.get("cache",{}).followups||[],
  outbox:LS.get("outbox",[]), draft:LS.get("draft",null)||blankDraft(),
  useCal:LS.get("useCal",true), transLang:LS.get("transLang","english"), transQuality:LS.get("transQuality","standard"), showPaste:false, claudeReply:"",
  trans:{pending:0,busy:false,msg:"",warn:false},
  loading:false, lastLoad:0, busy:false, peopleQ:"", recording:false, flushing:false,
  online:navigator.onLine, installEvt:null, error:""
};

let tT;
function toast(msg){ let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);} t.textContent=msg; clearTimeout(tT); tT=setTimeout(()=>t.remove(),3600); }

/* ---------- Team back end (Google Apps Script in the owner's account) ---------- */
// Every read and write goes through one script running as envolerinnovations@gmail.com,
// so the sheet, Docs and calendar reminders always belong to the owner account.
class PinError extends Error{}
async function api(action, data){
  if(!CFG.API_URL || !/^https:\/\/script\.google\.com\//.test(CFG.API_URL)) throw new Error("setup");
  let r;
  try{
    r=await fetch(CFG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({action,pin:S.pin,user:myName()},data||{}))});
  }catch(e){ throw new Error("network"); }
  if(!r.ok) throw new Error("Server returned "+r.status);
  let j; try{ j=await r.json(); }catch(e){ throw new Error("The back end didn't answer correctly. Check API_URL in config.js."); }
  if(j.code==="pin") throw new PinError(j.error);
  if(j.error) throw new Error(j.error);
  return j;
}
function pinFailed(){
  S.pin=""; LS.del("pin"); S.error="The team PIN has changed. Enter the new PIN to continue."; render();
}
const signedIn = () => !!(S.me && S.me.name && S.pin);
async function loadAll(quiet){
  if(!signedIn()||!navigator.onLine) return;
  S.loading=!quiet; if(!quiet) render();
  try{
    await flushOutbox();
    const r=await api("list");
    S.meetings=(r.meetings||[]).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    S.followups=r.followups||[];
    S.info={sheetUrl:r.sheetUrl,folderUrl:r.folderUrl,owner:r.owner}; LS.set("info",S.info);
    LS.set("cache",{meetings:S.meetings,followups:S.followups});
    S.lastLoad=Date.now(); S.error="";
  }catch(e){
    if(e instanceof PinError){ S.loading=false; pinFailed(); return; }
    S.error = e.message==="network" ? "Couldn't reach the team sheet. Showing your last saved copy." : "Couldn't load the team sheet: "+e.message;
  }
  S.loading=false; render();
}
function teamEmail(name){ const t=CFG.TEAM.find(p=>p.name===name); return t&&t.email?t.email:""; }

/* ---------- Outbox: saves work offline and syncs when signal returns ---------- */
function queue(op){ S.outbox.push(op); LS.set("outbox",S.outbox); }
async function flushOutbox(){
  if(S.flushing||!S.outbox.length||!signedIn()||!navigator.onLine) return;
  S.flushing=true;
  try{
    while(S.outbox.length){
      const op=S.outbox[0];
      if(op.type==="meeting"){
        const res=await api("saveMeeting",{meeting:op.meeting,followups:op.followups.map(f=>Object.assign({ownerEmail:teamEmail(f.owner)},f)),useCal:op.useCal});
        if(res.docUrl){ const m=S.meetings.find(x=>x.id===op.meeting.id); if(m) m.docUrl=res.docUrl; }
      } else if(op.type==="followup"){
        await api("updateFollowup",{f:op.f,calMove:op.calMove});
      }
      S.outbox.shift(); LS.set("outbox",S.outbox);
    }
  }catch(e){
    S.flushing=false;
    if(e instanceof PinError){ pinFailed(); return; }
    S.error="Some changes are waiting to sync. They'll go through when the connection is back.";
    return;
  }
  S.flushing=false;
}
async function sync(){ await flushOutbox(); await loadAll(true); }

/* ---------- names ---------- */
const myName = () => S.me ? S.me.name : "";
function teamNames(){ const n=CFG.TEAM.map(p=>p.name).filter(Boolean); if(myName() && !n.includes(myName())) n.unshift(myName()); return n; }

/* ---------- views ---------- */
function bucket(f){ const t=today(); if(f.due<t) return "overdue"; if(f.due===t) return "today"; if(f.due<=addDays(t,7)) return "week"; return "later"; }
function pendingIds(){ const s=new Set(); S.outbox.forEach(o=>{ if(o.type==="meeting"){ s.add(o.meeting.id); o.followups.forEach(f=>s.add(f.id)); } if(o.type==="followup") s.add(o.f.id); }); return s; }

function rowHTML(f,pend){
  const b = f.status==="done" ? "done" : bucket(f);
  const d = new Date((f.due||today())+"T00:00:00");
  const who = [f.contact,f.org].filter(Boolean).map(esc).join(", ");
  return `<div class="row ${b}" data-id="${esc(f.id)}">
    <div class="date cond"><span class="d">${d.getDate()}</span><span class="m">${MON[d.getMonth()]}</span></div>
    <div><p class="task">${esc(f.task)}</p><div class="meta">${who?who+"<br>":""}Owner: ${esc(f.owner||"Unassigned")}</div>${pend.has(f.id)?`<div class="pending">Waiting to sync</div>`:""}</div>
    <div class="acts">${f.status==="done"
      ? `<button class="btn" data-act="reopen">Reopen</button>`
      : `<button class="btn ok" data-act="done">Mark done</button><button class="btn" data-act="snooze">+3 days</button>`}</div>
  </div>`;
}
function banners(){
  let h="";
  if(!S.online) h+=`<div class="banner">You're offline. You can still log meetings; they'll sync when you're back online.</div>`;
  if(S.error) h+=`<div class="banner">${esc(S.error)}</div>`;
  if(S.outbox.length && S.online) h+=`<div class="banner">${S.outbox.length} change${S.outbox.length>1?"s":""} waiting to sync. <br><button class="btn" id="syncNow">Sync now</button></div>`;
  return h;
}
function viewToday(){
  const mine = f => S.scope==="all" || f.owner===myName();
  const open = S.followups.filter(f=>f.status!=="done" && mine(f));
  const g = {overdue:[],today:[],week:[],later:[]};
  open.sort((a,b)=>(a.due||"").localeCompare(b.due||"")).forEach(f=>g[bucket(f)].push(f));
  const pend=pendingIds();
  const sections=[["overdue","Overdue"],["today","Due today"],["week","Next 7 days"],["later","Later"]].filter(([k])=>g[k].length)
    .map(([k,l])=>`<div class="group-h ${k}">${l}<span class="n">${g[k].length}</span></div>${g[k].map(f=>rowHTML(f,pend)).join("")}`).join("");
  const done=S.followups.filter(f=>f.status==="done"&&mine(f)).sort((a,b)=>Number(b.doneAt||0)-Number(a.doneAt||0)).slice(0,5);
  const n=g.today.length+g.overdue.length;
  return `<section class="board" aria-label="Follow-up summary">
      <div class="brand"><span>Envoler follow-ups, ${fmt(today())}</span>
        <span><button class="icon-btn" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button class="icon-btn" id="openSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></span></div>
      <div class="big">${n===0?"All clear":`${n} to chase today`}</div>
      <div class="sub">${g.overdue.length?`<b>${g.overdue.length} overdue</b>, `:""}${g.today.length} due today, ${g.week.length} this week</div>
      <div class="scope" role="group" aria-label="Whose follow-ups">
        <button data-scope="mine" aria-pressed="${S.scope==="mine"}">Mine</button>
        <button data-scope="all" aria-pressed="${S.scope==="all"}">Whole team</button>
      </div>
    </section>
    ${installHint()}${banners()}

function peopleIndex(){

/* ---------- recording and transcription ---------- */
// Audio is cut into 4-minute parts, saved on the phone (IndexedDB) and sent to OpenAI one part at a time.
// Nothing is lost if the signal drops: parts wait on the phone until they can be transcribed.
const SEG_MS = 4*60*1000;
const IDB = {
  db:null,
  open(){ return this.db || (this.db = new Promise((res,rej)=>{ const r=indexedDB.open("envoler",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("audio",{keyPath:"id"});
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); },
  async run(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("audio",mode); const req=fn(t.objectStore("audio"));
    t.oncomplete=()=>res(req?req.result:undefined); t.onerror=()=>rej(t.error); }); },
  put(o){ return this.run("readwrite",st=>st.put(o)); },
  del(id){ return this.run("readwrite",st=>st.delete(id)); },
  all(){ return this.run("readonly",st=>st.getAll()); }
};
const R = {stream:null, mr:null, rotateT:null, timer:null, wake:null, mime:"", seq:0, session:"", startAt:0};
const pad2 = n => String(n).padStart(2,"0");
const clock = ms => { const t=Math.floor(ms/1000); const h=Math.floor(t/3600); return (h?h+":":"")+pad2(Math.floor(t%3600/60))+":"+pad2(t%60); };
function pickMime(){
  const c=["audio/webm;codecs=opus","audio/webm","audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/aac"];
  return c.find(t=>window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
}
function extFor(type){ type=String(type||"");
  if(type.includes("webm")) return "webm"; if(type.includes("wav")) return "wav"; if(type.includes("ogg")) return "ogg";
  if(type.includes("mpeg")||type.includes("mp3")) return "mp3"; return "m4a"; }

async function startRecording(){
  if(!window.MediaRecorder || !navigator.mediaDevices){ toast("Recording isn't supported in this browser. Use Upload a recording instead."); return; }
  captureDraft();
  try{ R.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ toast("Microphone access is blocked. Allow the microphone for this app in your phone's settings."); return; }
  R.mime=pickMime(); R.session=uid(); R.seq=0; R.startAt=Date.now(); S.recording=true;
  try{ if(navigator.wakeLock) R.wake=await navigator.wakeLock.request("screen"); }catch(e){}
  R.stream.getAudioTracks().forEach(t=>t.addEventListener("ended",()=>{ if(S.recording){ stopRecording(); toast("Recording stopped because the phone paused the microphone. What was recorded is saved."); } }));
  startSegment();
  R.timer=setInterval(()=>{ const el=$("#recTime"); if(el) el.textContent=clock(Date.now()-R.startAt); },1000);
  render();
}
function startSegment(){
  let mr;
  try{ mr=new MediaRecorder(R.stream, Object.assign({audioBitsPerSecond:32000}, R.mime?{mimeType:R.mime}:{})); }
  catch(e){ mr=new MediaRecorder(R.stream); }
  const chunks=[], seq=R.seq++, t0=Date.now(), session=R.session, label=seq===0?new Date(R.startAt):null;
  mr.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  mr.onstop=()=>{ if(!chunks.length) return; const type=mr.mimeType||R.mime||"audio/webm";
    saveAudio({id:`${session}-${String(seq).padStart(4,"0")}`, blob:new Blob(chunks,{type}), type, dur:(Date.now()-t0)/1000, mode:"live",
      label:label?`Recording, ${fmt(ymd(label))} ${pad2(label.getHours())}:${pad2(label.getMinutes())}`:""}); };
  mr.start(1000); R.mr=mr;
  R.rotateT=setTimeout(()=>{ if(S.recording && R.mr===mr){ try{ mr.stop(); }catch(e){} startSegment(); } }, SEG_MS);
}
function stopRecording(){
  if(!S.recording) return;
  S.recording=false; clearTimeout(R.rotateT); clearInterval(R.timer);
  try{ if(R.mr && R.mr.state!=="inactive") R.mr.stop(); }catch(e){}
  if(R.stream) R.stream.getTracks().forEach(t=>t.stop());
  try{ if(R.wake) R.wake.release(); }catch(e){}
  R.wake=null; render();
}
async function saveAudio(item){
  item.createdAt=Date.now();
  try{ await IDB.put(item); }catch(e){ R.memory=(R.memory||[]).concat(item); }
  processQueue();
}
async function queuedAudio(){
  let items=[]; try{ items=await IDB.all(); }catch(e){}
  items=items.concat(R.memory||[]);
  return items.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
}
async function removeAudio(id){ try{ await IDB.del(id); }catch(e){} R.memory=(R.memory||[]).filter(x=>x.id!==id); }

function audioDuration(file){
  return new Promise(res=>{ const a=document.createElement("audio"); const u=URL.createObjectURL(file); let done=false;
    const fin=v=>{ if(done) return; done=true; URL.revokeObjectURL(u); res(v); };
    a.preload="metadata"; a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:NaN); a.onerror=()=>fin(NaN);
    setTimeout(()=>fin(NaN),6000); a.src=u; });
}
async function handleUpload(file){
  if(!file) return;
  captureDraft();
  const base="up"+uid(), label=`Uploaded recording: ${file.name}`;
  S.trans.msg="Preparing the recording…"; S.trans.warn=false; render();
  try{
    await saveAudio({id:`${base}-0000`,blob:file,type:file.type||"audio/m4a",dur:await audioDuration(file),mode:"upload",label});
  }catch(e){
    S.trans.msg="This file couldn't be read on the phone. Try a shorter recording, or record inside the app instead."; S.trans.warn=true; render();
  }
}

let qRunning=false;
async function processQueue(){
  if(qRunning) return; qRunning=true;
  try{
    let items=await queuedAudio();
    S.trans.pending=items.length;
    while(items.length){
      if(S.recording){ S.trans.msg="Recording is saved as you go. It will be turned into text when you tap Stop."; S.trans.warn=false; break; }
      const it=items[0];
      S.trans.busy=true; S.trans.warn=false; S.trans.msg=`Turning speech into text on this phone… ${items.length} part${items.length>1?"s":""} left. Keep the app open.`; renderRecStatus();
      let text;
      try{ text=await transcribe(it); }
      catch(e){ S.trans.msg=e.message; S.trans.warn=true; S.trans.retry=true; break; }
      captureDraft();
      const add=(it.label?`\n[${it.label}]\n`:"")+text.trim();
      const cur=S.draft.notes; S.draft.notes=cur?cur+(cur.endsWith("\n")?"":"\n")+add:add.replace(/^\n/,"");
      LS.set("draft",S.draft);
      const ta=$("#notes"); if(ta){ ta.value=S.draft.notes; ta.scrollTop=ta.scrollHeight; }
      await removeAudio(it.id);
      items=await queuedAudio(); S.trans.pending=items.length;
      if(!items.length){ S.trans.msg="Transcript added to the notes. Check it, then save the meeting."; S.trans.warn=false; S.trans.retry=false; }
    }
  } finally { S.trans.busy=false; qRunning=false; renderRecStatus(); }
}
let worker=null, wReq=0;
const wPending=new Map();
const modelId=()=>S.transQuality==="high"?"onnx-community/whisper-small":"onnx-community/whisper-base";
function getWorker(){
  if(worker) return worker;
  worker=new Worker("whisper-worker.js",{type:"module"});
  worker.onmessage=e=>{ const m=e.data;
    if(m.type==="progress"){ S.trans.msg=m.text; S.trans.warn=false; renderRecStatus(); return; }
    const p=wPending.get(m.id); if(!p) return; wPending.delete(m.id);
    if(m.error) p.reject(new Error(m.error)); else p.resolve(m.text||""); };
  worker.onerror=ev=>{ ev.preventDefault&&ev.preventDefault(); for(const p of wPending.values()) p.reject(new Error(navigator.onLine?"Failed to load the speech engine":"network: offline")); wPending.clear(); worker=null; };
  return worker;
}
function runWhisper(audio,warmup){
  return new Promise((resolve,reject)=>{ const id=++wReq; wPending.set(id,{resolve,reject});
    const msg={id,model:modelId(),task:S.transLang==="spoken"?"transcribe":"translate",warmup:!!warmup};
    if(audio){ msg.audio=audio; getWorker().postMessage(msg,[audio.buffer]); } else getWorker().postMessage(msg); });
}
async function decode16k(blob){
  const Ctx=window.AudioContext||window.webkitAudioContext;
  let ctx; try{ ctx=new Ctx({sampleRate:16000}); }catch(e){ ctx=new Ctx(); }
  const ab=await blob.arrayBuffer();
  const buf=await new Promise((res,rej)=>{ const p=ctx.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); });
  try{ ctx.close(); }catch(e){}
  let mono=buf.getChannelData(0);
  if(buf.numberOfChannels>1){ const b=buf.getChannelData(1), m=new Float32Array(mono.length); for(let i=0;i<m.length;i++) m[i]=(mono[i]+b[i])/2; mono=m; }
  if(buf.sampleRate===16000) return mono;
  const ratio=buf.sampleRate/16000, n=Math.floor(mono.length/ratio), out=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i*ratio, j=Math.floor(x), f=x-j; out[i]=(mono[j]||0)*(1-f)+(mono[j+1]||0)*f; }
  return out;
}
function whisperError(e){
  const m=String(e&&e.message||e);
  if(/fetch|network|Failed to load|404|Load failed/i.test(m)) return "The speech model needs to download once. Connect to Wi-Fi, then tap Retry. Your recording is saved.";
  if(/memory|allocation|OOM/i.test(m)) return "The phone ran out of memory on this recording. Choose Standard quality in Settings, or record shorter parts, then tap Retry.";
  return "Couldn't turn this recording into text ("+m.slice(0,120)+"). Your recording is saved; tap Retry.";
}
async function transcribe(it){
  let audio;
  try{ audio=await decode16k(it.blob); }
  catch(e){ throw new Error("This recording couldn't be read on this phone. Try another file, or record inside the app."); }
  const SL=16000*300, n=Math.ceil(audio.length/SL)||1; let text="";
  for(let k=0;k<n;k++){
    if(n>1){ S.trans.msg=`Turning speech into text on this phone… section ${k+1} of ${n}. Keep the app open.`; renderRecStatus(); }
    const part=audio.slice(k*SL,Math.min(audio.length,(k+1)*SL));
    try{ text+=(text?" ":"")+String(await runWhisper(part)).trim(); }
    catch(e){ throw new Error(whisperError(e)); }
  }
  return text;
}
async function downloadModel(){
  S.trans.msg="Preparing the speech model…"; S.trans.warn=false; renderRecStatus();
  try{ await runWhisper(null,true); S.trans.msg="The speech model is ready on this phone. Recordings will now work even offline."; }
  catch(e){ S.trans.msg=whisperError(e); S.trans.warn=true; }
  renderRecStatus();
}
async function discardAudio(){
  if(!confirm("Delete the recordings waiting on this phone? They haven't been turned into text yet.")) return;
  for(const it of await queuedAudio()) await removeAudio(it.id);
  S.trans={pending:0,busy:false,msg:"",warn:false}; render();
}
function recStatusHTML(){
  const t=S.trans; if(!t.msg) return "";
  return `<div class="tstatus ${t.warn?"warn":""}" id="tstatus">${esc(t.msg)}
    ${t.retry&&!t.busy?`<div class="bar" style="margin-top:6px"><button class="btn" id="retryTrans">Retry</button><button class="btn danger" id="discardAudio">Delete recordings</button></div>`:""}
</div>`;
}
function renderRecStatus(){ const el=$("#recstat"); if(el) el.innerHTML=recStatusHTML(); }
function recorderHTML(){
  if(S.recording) return `<div class="reccard">
    <div class="live"><span class="dot"></span>Recording <span id="recTime">${clock(Date.now()-R.startAt)}</span></div>
    <div class="hint">Keep the app open with the screen on. When you tap Stop, the recording is turned into text on this phone.</div>
    <button class="btn record wide" id="recStop">Stop recording</button>
    <div id="recstat">${recStatusHTML()}</div></div>`;
  return `<div class="reccard">
    <button class="btn record wide" id="recStart">● Record meeting</button>
    <label class="btn wide upload">Upload a recording<input type="file" id="upload" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg,.webm,.mp4"></label>
    <div class="hint">For long meetings, or to keep the phone locked, record with your phone's Voice Memos or Recorder app and upload the file here afterwards.</div>
    <div id="recstat">${recStatusHTML()}</div></div>`;
}

/* ---------- events ---------- */
let saveT;
document.addEventListener("input",e=>{
  if(e.target.id==="pq"){ S.peopleQ=e.target.value; render(); return; }
  if(e.target.id==="claudeReply"){ S.claudeReply=e.target.value; return; }
  if(S.view==="log"){ clearTimeout(saveT); saveT=setTimeout(captureDraft,400); }
});
document.addEventListener("change",e=>{
  if(e.target.id==="upload"){ const f=e.target.files&&e.target.files[0]; e.target.value=""; handleUpload(f); return; }
  if(e.target.id==="useCal"||e.target.id==="useCal2"){ S.useCal=e.target.checked; LS.set("useCal",S.useCal); }
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.v){ if(S.view==="log") captureDraft(); S.view=t.dataset.v; render(); window.scrollTo(0,0); return; }
  if(t.dataset.scope){ S.scope=t.dataset.scope; render(); return; }
  switch(t.id){
    case "doSetup": return doSetup();
    case "switchUser": S.pin=""; LS.del("pin"); S.error=""; render(); return;
    case "refresh": toast("Refreshing…"); return sync();
    case "syncNow": return sync();
    case "openSettings": if(S.view==="log") captureDraft(); S.view="settings"; render(); window.scrollTo(0,0); return;
    case "back": S.view="today"; render(); return;
    case "askClaude": return askClaude();
    case "applyClaude": return applyClaude();
    case "cancelClaude": S.showPaste=false; S.claudeReply=""; render(); return;
    case "getModel": return downloadModel();
    case "saveTrans": S.transLang=$("#transLang").value; LS.set("transLang",S.transLang); S.transQuality=$("#transQuality").value; LS.set("transQuality",S.transQuality); toast("Saved."); return;
    case "recStart": return startRecording();
    case "recStop": stopRecording(); toast("Recording saved. Transcribing…"); return;
    case "retryTrans": S.trans.retry=false; return processQueue();
    case "discardAudio": return discardAudio();

    case "addItem": captureDraft(); S.draft.items.push({task:"",contact:S.draft.person,org:S.draft.org,due:addDays(today(),3),owner:myName()}); render(); return;
    case "saveMeeting": return saveMeeting();
    case "clearDraft": if(confirm("Clear this draft? The notes will be lost.")){ S.draft=blankDraft(); LS.set("draft",S.draft); render(); } return;

    case "install": if(S.installEvt){ S.installEvt.prompt(); S.installEvt=null; render(); } return;
    case "hideInstall": LS.set("hideInstall",true); render(); return;
  }
  if(t.dataset.rm!=null){ captureDraft(); S.draft.items.splice(+t.dataset.rm,1); LS.set("draft",S.draft); render(); return; }
  if(t.dataset.newfor!=null){ S.draft=Object.assign(blankDraft(),{person:t.dataset.newfor,org:t.dataset.neworg}); LS.set("draft",S.draft); S.view="log"; render(); window.scrollTo(0,0); return; }
  const row=t.closest(".row"); if(row&&t.dataset.act) return changeFollowup(row.dataset.id,t.dataset.act);
});
window.addEventListener("online",()=>{ S.online=true; render(); sync(); processQueue(); });
window.addEventListener("offline",()=>{ S.online=false; render(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && Date.now()-S.lastLoad>60000 && signedIn()) sync(); });
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); S.installEvt=e; render(); });

/* ---------- start ---------- */
["oaKey","aiKey","token","sheetId","lastSilent","oauthState","returnView"].forEach(k=>LS.del(k));
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
processQueue();
if(signedIn()) loadAll();
})();
</script>
