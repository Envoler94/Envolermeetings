<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Envoler Follow-ups</title>
<meta name="theme-color" content="#13233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Follow-ups">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --ink:#13233A; --muted:#5B6B80; --line:#D3DDE8;
  --sky:#1F5FA8; --sky-soft:#DCE8F6; --amber:#B07500; --amber-soft:#FDF0D3;
  --red:#B8392A; --red-soft:#F8DEDA; --green:#2C7A55; --green-soft:#DBF0E4;
  --board:#13233A; --board-ink:#F3F6FA; --board-dim:#A3B3C8; --on-sky:#FFFFFF;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1826; --surface:#16233A; --ink:#E7EDF5; --muted:#9AAAC0; --line:#2A3B55;
    --sky:#79AEEB; --sky-soft:#1D3555; --amber:#F0B640; --amber-soft:#3A2F14;
    --red:#EE7F70; --red-soft:#43211D; --green:#6CC79A; --green-soft:#173627;
    --board:#081120; --board-ink:#F3F6FA; --board-dim:#8597AF; --on-sky:#0E1826;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.cond{font-family:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}

.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:18px 20px 16px}
.board .brand{display:flex;justify-content:space-between;align-items:center;color:var(--board-dim);font-size:14px;gap:8px}
.icon-btn{border:0;background:rgba(255,255,255,.1);color:var(--board-ink);border-radius:10px;width:38px;height:38px;display:inline-grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.board .big{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:clamp(40px,11vw,64px);line-height:1;margin:12px 0 4px}
.board .sub{color:var(--board-dim)}
.board .sub b{color:#FFB4A8;font-weight:600}
.scope{display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;margin-top:14px}
.scope button{border:0;background:transparent;color:var(--board-dim);padding:6px 14px;border-radius:999px;font-size:14px}
.scope button[aria-pressed="true"]{background:var(--board-ink);color:var(--board)}

h2{font-size:24px;font-weight:600;margin:12px 0 10px}
.group-h{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px;font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:18px}
.group-h .n{color:var(--muted);font-weight:500;font-size:15px}
.group-h.overdue{color:var(--red)} .group-h.today{color:var(--amber)}

.row{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:start;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.date{font-family:"Barlow Semi Condensed",sans-serif;text-align:center;border-radius:8px;padding:4px 0;background:var(--sky-soft);color:var(--sky)}
.date .d{font-size:22px;font-weight:700;line-height:1.1;display:block}
.date .m{font-size:13px}
.row.overdue .date{background:var(--red-soft);color:var(--red)}
.row.today .date{background:var(--amber-soft);color:var(--amber)}
.row.done{opacity:.6} .row.done .task{text-decoration:line-through}
.task{font-weight:600;margin:0 0 2px}
.meta{color:var(--muted);font-size:14px}
.acts{display:flex;flex-direction:column;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:500;min-height:40px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--sky);border-color:var(--sky);color:var(--on-sky)}
.btn.ok{border-color:var(--green);color:var(--green)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wide{width:100%;padding:12px;font-size:16px}
.rec{background:var(--red);border-color:var(--red);color:#fff}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);text-align:center;margin-top:16px}
.pending{font-size:12px;color:var(--amber);font-weight:600}

label{display:block;font-size:14px;font-weight:500;color:var(--muted);margin:14px 0 4px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{min-height:180px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h3{margin:0 0 8px;font-size:19px}
.draft-f{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.draft-f:first-of-type{border-top:0;margin-top:0;padding-top:0}
.x{border:0;background:none;color:var(--red);font-size:14px;padding:6px 0}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px}
.check input{width:20px;height:20px}

.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.person summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.person summary::-webkit-details-marker{display:none}
.person .body{padding:0 14px 14px;font-size:15px}
.pill{font-size:13px;border-radius:999px;padding:2px 9px;background:var(--sky-soft);color:var(--sky);white-space:nowrap;align-self:center}
.pill.warn{background:var(--red-soft);color:var(--red)}
.note{white-space:pre-wrap;font-size:15px;background:var(--bg);border-radius:8px;padding:10px;max-height:260px;overflow:auto}
ul.plain{padding-left:18px;margin:6px 0}
.banner{background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.banner .btn{margin-top:8px}

.signin{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.signin .board{padding:28px 22px}
.signin p{color:var(--board-dim);margin:8px 0 20px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border:0;border-radius:12px;padding:13px;font-weight:600;font-size:16px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:720px}
nav.tabs button{border:0;background:none;padding:10px 2px 12px;font-size:13px;white-space:nowrap;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--sky);font-weight:600}
nav.tabs[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:15px;z-index:9;max-width:90vw;text-align:center}
@media (max-width:420px){ .row{grid-template-columns:52px 1fr} .acts{grid-column:1/-1;flex-direction:row} .acts .btn{flex:1} }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<nav class="tabs" id="tabs" aria-label="Sections" hidden><div class="in">
  <button data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Follow-ups</button>
  <button data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>Log meeting</button>
  <button data-v="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"/></svg>People</button>
  <button data-v="meetings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h6"/></svg>Meetings</button>
</div></nav>

<script>
(() => {
"use strict";
const CFG = Object.assign({TEAM:[],TIME_ZONE:"Asia/Kolkata",REMINDER_TIME:"10:00",CLAUDE_MODEL:"claude-sonnet-5-5"}, window.ENVOLER_CONFIG||{});
const SCOPES = ["openid","email","profile",
  "https://www.googleapis.com/auth/drive",
  "https://www.googleapis.com/auth/spreadsheets",
  "https://www.googleapis.com/auth/calendar.events"].join(" ");
const SHEET_NAME = "Envoler Follow-ups Data";
const M_COLS = ["id","date","person","org","summary","decisions","notes","createdBy","createdAt","docUrl"];
const F_COLS = ["id","task","contact","org","due","owner","status","meetingId","createdBy","createdAt","doneAt","eventId"];
const M_END = "J", F_END = "L";

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = s => { if(!s) return ""; const d=new Date(s+"T00:00:00"); return isNaN(d)?s:`${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const key = (n,o) => String(n||"").trim().toLowerCase()+"|"+String(o||"").trim().toLowerCase();
const LS = {
  get(k,d){ try{ const v=localStorage.getItem("env_"+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("env_"+k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("env_"+k); }catch(e){} }
};
const blankDraft = () => ({person:"",org:"",date:today(),notes:"",summary:"",decisions:[],items:[]});

const S = {
  view:"today", scope:"mine",
  token:LS.get("token",null), me:LS.get("me",null),
  sheetId: CFG.SHEET_ID || LS.get("sheetId",""),
  meetings:LS.get("cache",{}).meetings||[], followups:LS.get("cache",{}).followups||[],
  outbox:LS.get("outbox",[]), draft:LS.get("draft",null)||blankDraft(),
  aiKey:LS.get("aiKey",""), useCal:LS.get("useCal",true),
  loading:false, lastLoad:0, busy:false, peopleQ:"", recording:false, flushing:false,
  online:navigator.onLine, installEvt:null, error:""
};

let tT;
function toast(msg){ let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);} t.textContent=msg; clearTimeout(tT); tT=setTimeout(()=>t.remove(),3600); }

/* ---------- Google sign-in (redirect flow: works in installed apps on iOS and Android) ---------- */
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/,"");
function signIn(silent){
  if(!CFG.GOOGLE_CLIENT_ID || CFG.GOOGLE_CLIENT_ID.startsWith("PASTE")){ S.error="Add your Google Client ID to config.js first (README step 3)."; render(); return; }
  if(silent){
    if(Date.now()-LS.get("lastSilent",0)<60000){ render(); return; } // avoid sign-in loops
    LS.set("lastSilent",Date.now());
  }
  captureDraft(); LS.set("draft",S.draft);
  const state=uid(); LS.set("oauthState",state); LS.set("returnView",S.view);
  const p=new URLSearchParams({client_id:CFG.GOOGLE_CLIENT_ID,redirect_uri:redirectUri(),response_type:"token",scope:SCOPES,include_granted_scopes:"true",state});
  if(silent && S.me && S.me.email){ p.set("prompt","none"); p.set("login_hint",S.me.email); }
  else if(S.me && S.me.email){ p.set("login_hint",S.me.email); }
  location.href="https://accounts.google.com/o/oauth2/v2/auth?"+p.toString();
}
let returnedFromGoogle=false;
function readRedirect(){
  if(!location.hash || location.hash.length<2) return;
  returnedFromGoogle=true;
  const h=new URLSearchParams(location.hash.slice(1));
  if(!h.get("access_token") && !h.get("error")) return;
  history.replaceState(null,"",redirectUri());
  if(h.get("state")!==LS.get("oauthState",null)){ S.error="Sign-in check failed. Please sign in again."; return; }
  LS.del("oauthState"); S.view=LS.get("returnView","today");
  if(h.get("error")){ S.token=null; LS.del("token"); if(h.get("error")!=="interaction_required"&&h.get("error")!=="login_required"&&h.get("error")!=="consent_required") S.error="Google sign-in didn't complete. Try again."; return; }
  S.token={value:h.get("access_token"),exp:Date.now()+(parseInt(h.get("expires_in")||"3600",10)-120)*1000};
  LS.set("token",S.token);
}
const tokenOk = () => S.token && S.token.exp > Date.now();
function signOut(){ LS.del("token"); LS.del("me"); S.token=null; S.me=null; render(); }

class AuthError extends Error{}
async function g(url, opts={}){
  if(!tokenOk()) throw new AuthError("expired");
  const r=await fetch(url,Object.assign({},opts,{headers:Object.assign({Authorization:"Bearer "+S.token.value},opts.headers||{})}));
  if(r.status===401){ S.token=null; LS.del("token"); throw new AuthError("expired"); }
  if(!r.ok){ let m=""; try{ m=(await r.json()).error.message; }catch(e){} const err=new Error(m||("Google returned "+r.status)); err.status=r.status; throw err; }
  return r.status===204?null:r.json();
}
const gj = (url, method, body) => g(url,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});

/* ---------- Sheets as the shared database ---------- */
const SH = "https://sheets.googleapis.com/v4/spreadsheets/";
const toObj = (cols,row) => Object.fromEntries(cols.map((c,i)=>[c,row[i]??""]));
const toRow = (cols,o) => cols.map(c=>o[c]==null?"":String(o[c]));

async function ensureSheet(){
  if(S.sheetId) return S.sheetId;
  const q=encodeURIComponent(`name='${SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const found=await g(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=1`);
  if(found.files && found.files[0]){ S.sheetId=found.files[0].id; LS.set("sheetId",S.sheetId); return S.sheetId; }
  const hdr=cols=>[{values:cols.map(c=>({userEnteredValue:{stringValue:c}}))}];
  const created=await gj(SH,"POST",{properties:{title:SHEET_NAME},sheets:[
    {properties:{title:"Meetings",gridProperties:{frozenRowCount:1}},data:[{startRow:0,startColumn:0,rowData:hdr(M_COLS)}]},
    {properties:{title:"Followups",gridProperties:{frozenRowCount:1}},data:[{startRow:0,startColumn:0,rowData:hdr(F_COLS)}]}]});
  S.sheetId=created.spreadsheetId; LS.set("sheetId",S.sheetId);
  if(CFG.DRIVE_FOLDER_ID){ try{ await g(`https://www.googleapis.com/drive/v3/files/${S.sheetId}?addParents=${CFG.DRIVE_FOLDER_ID}&removeParents=root&supportsAllDrives=true`,{method:"PATCH"}); }catch(e){} }
  return S.sheetId;
}
async function loadAll(quiet){
  if(!tokenOk()||!navigator.onLine) return;
  S.loading=!quiet; if(!quiet) render();
  try{
    if(!S.me){
      const u=await g("https://www.googleapis.com/oauth2/v3/userinfo");
      const t=CFG.TEAM.find(p=>p.email && p.email.toLowerCase()===String(u.email).toLowerCase());
      S.me={email:u.email,name:t?t.name:(u.name||u.email)}; LS.set("me",S.me);
    }
    await ensureSheet();
    await flushOutbox();
    const r=await g(`${SH}${S.sheetId}/values:batchGet?ranges=Meetings!A2:${M_END}&ranges=Followups!A2:${F_END}`);
    const [m,f]=r.valueRanges;
    S.meetings=(m.values||[]).map(row=>toObj(M_COLS,row)).filter(x=>x.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    S.followups=(f.values||[]).map(row=>toObj(F_COLS,row)).filter(x=>x.id);
    LS.set("cache",{meetings:S.meetings,followups:S.followups});
    S.lastLoad=Date.now(); S.error="";
  }catch(e){
    if(e instanceof AuthError){ signIn(true); return; }
    S.error = e.status===403||e.status===404 ? "Can't open the team sheet. Ask the owner to share the Envoler Meetings folder with you as an editor." : "Couldn't load from Google. Showing your last saved copy.";
  }
  S.loading=false; render();
}
async function findRow(tab,id){
  const r=await g(`${SH}${S.sheetId}/values/${tab}!A:A`);
  const i=(r.values||[]).findIndex(v=>v[0]===id);
  return i<0?null:i+1;
}
async function appendRows(tab,end,rows){
  if(!rows.length) return;
  await gj(`${SH}${S.sheetId}/values/${tab}!A1:${end}1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,"POST",{values:rows});
}
async function updateRow(tab,end,cols,obj){
  const row=await findRow(tab,obj.id); if(!row) return;
  await gj(`${SH}${S.sheetId}/values/${tab}!A${row}:${end}${row}?valueInputOption=RAW`,"PUT",{values:[toRow(cols,obj)]});
}

/* ---------- Drive meeting notes and Calendar reminders ---------- */
function teamEmail(name){ const t=CFG.TEAM.find(p=>p.name===name); return t&&t.email?t.email:""; }
function noteHTML(m,fs){
  const li=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"<p>None</p>";
  return `<html><body><h1>Meeting with ${esc(m.person||"—")}${m.org?", "+esc(m.org):""}</h1>
  <p><b>Date:</b> ${esc(fmt(m.date))}<br><b>Logged by:</b> ${esc(m.createdBy||"")}</p>
  <h2>Summary</h2><p>${esc(m.summary||"—")}</p>
  <h2>Decisions</h2>${li(String(m.decisions||"").split("\n").filter(Boolean))}
  <h2>Follow-ups</h2>${li(fs.map(f=>`${f.task} (due ${fmt(f.due)}, owner ${f.owner||"—"})`))}
  <h2>Notes</h2>${String(m.notes||"—").split("\n").map(l=>`<p>${esc(l)}</p>`).join("")}</body></html>`;
}
async function createDoc(m,fs){
  const b="envoler"+uid();
  const meta={name:`${m.date} ${m.person||"Meeting"}${m.org?", "+m.org:""}`,mimeType:"application/vnd.google-apps.document"};
  if(CFG.DRIVE_FOLDER_ID) meta.parents=[CFG.DRIVE_FOLDER_ID];
  const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: text/html; charset=UTF-8\r\n\r\n${noteHTML(m,fs)}\r\n--${b}--`;
  const r=await g("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink&supportsAllDrives=true",
    {method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body});
  return r.webViewLink||"";
}
function eventBody(f){
  const [h,mi]=(CFG.REMINDER_TIME||"10:00").split(":").map(Number);
  const end=`${pad(h)}:${pad((mi||0)+15>59?59:(mi||0)+15)}`;
  const ev={summary:`Follow up: ${f.task}`,
    description:`With ${f.contact||"—"}${f.org?", "+f.org:""}\nOwner: ${f.owner||"—"}\nFrom Envoler Follow-ups`,
    start:{dateTime:`${f.due}T${pad(h)}:${pad(mi||0)}:00`,timeZone:CFG.TIME_ZONE},
    end:{dateTime:`${f.due}T${end}:00`,timeZone:CFG.TIME_ZONE},
    reminders:{useDefault:false,overrides:[{method:"popup",minutes:0},{method:"popup",minutes:24*60}]}};
  const em=teamEmail(f.owner);
  if(em && (!S.me || em.toLowerCase()!==S.me.email.toLowerCase())) ev.attendees=[{email:em}];
  return ev;
}
const CAL="https://www.googleapis.com/calendar/v3/calendars/primary/events";

/* ---------- Outbox: saves work offline and syncs when signal returns ---------- */
function queue(op){ S.outbox.push(op); LS.set("outbox",S.outbox); }
async function flushOutbox(){
  if(S.flushing||!S.outbox.length||!tokenOk()||!navigator.onLine) return;
  S.flushing=true;
  try{
    await ensureSheet();
    while(S.outbox.length){
      const op=S.outbox[0];
      if(op.type==="meeting"){
        if(op.useCal && !op.calDone){
          for(const f of op.followups){ if(!f.eventId){ try{ const ev=await gj(CAL+"?sendUpdates=all","POST",eventBody(f)); f.eventId=ev.id; }catch(e){ if(e instanceof AuthError) throw e; } LS.set("outbox",S.outbox); } }
          op.calDone=true; LS.set("outbox",S.outbox);
        }
        if(!op.docDone){ try{ op.meeting.docUrl=await createDoc(op.meeting,op.followups); }catch(e){ if(e instanceof AuthError) throw e; op.docError=true; } op.docDone=true; LS.set("outbox",S.outbox); }
        if(!op.rowsDone){
          await appendRows("Meetings",M_END,[toRow(M_COLS,op.meeting)]);
          await appendRows("Followups",F_END,op.followups.map(f=>toRow(F_COLS,f)));
          op.rowsDone=true; LS.set("outbox",S.outbox);
        }
        if(op.docError) toast("Meeting saved. The Drive note couldn't be created; check folder access.");
      } else if(op.type==="followup"){
        await updateRow("Followups",F_END,F_COLS,op.f);
        if(op.f.eventId){
          try{
            if(op.f.status==="done") await g(`${CAL}/${op.f.eventId}`,{method:"DELETE"});
            else if(op.calMove) await gj(`${CAL}/${op.f.eventId}`,"PATCH",{start:eventBody(op.f).start,end:eventBody(op.f).end});
          }catch(e){ if(e instanceof AuthError) throw e; }
        }
      }
      S.outbox.shift(); LS.set("outbox",S.outbox);
    }
  }catch(e){
    if(e instanceof AuthError){ S.flushing=false; signIn(true); return; }
    S.error="Some changes are waiting to sync. They'll go through when Google is reachable.";
  }
  S.flushing=false;
}
async function sync(){ await flushOutbox(); await loadAll(true); }

function bucket(f){ const t=today(); if(f.due<t) return "overdue"; if(f.due===t) return "today"; if(f.due<=addDays(t,7)) return "week"; return "later"; }
function pendingIds(){ const s=new Set(); S.outbox.forEach(o=>{ if(o.type==="meeting"){ s.add(o.meeting.id); o.followups.forEach(f=>s.add(f.id)); } if(o.type==="followup") s.add(o.f.id); }); return s; }

function peopleIndex(){
  const m=new Map();
  const get=(n,o)=>{ const k=key(n,o); if(k==="|") return null; if(!m.has(k)) m.set(k,{name:n,org:o,meetings:[],open:[],last:""}); return m.get(k); };
  S.meetings.forEach(x=>{ const p=get(x.person,x.org); if(p){ p.meetings.push(x); if((x.date||"")>p.last) p.last=x.date; } });
  S.followups.forEach(f=>{ const p=get(f.contact,f.org); if(p&&f.status!=="done") p.open.push(f); });
  return [...m.values()].sort((a,b)=>(b.last||"").localeCompare(a.last||""));
}

function captureDraft(){
  const d=S.draft, gid=id=>document.getElementById(id);
  if(!gid("person")) return;
  d.person=gid("person").value; d.org=gid("org").value; d.date=gid("mdate").value||today(); d.notes=gid("notes").value;
  if(gid("summary")) d.summary=gid("summary").value;
  document.querySelectorAll(".draft-f").forEach(el=>{ const it=d.items[+el.dataset.i]; if(it) el.querySelectorAll("[data-f]").forEach(i=>{ it[i.dataset.f]=i.value; }); });
  LS.set("draft",d);
}
function matchOwner(name){
  const n=String(name||"").toLowerCase().trim();
  if(!n||["me","i","you","myself"].includes(n)) return myName();
  const hit=teamNames().find(t=>t.toLowerCase().includes(n)||n.includes(t.toLowerCase().split(" ")[0]));
  return hit||myName();
}
async function extract(){
  captureDraft();
  const d=S.draft;
  if(!d.notes.trim()){ toast("Add notes or a transcript first."); return; }
  S.busy=true; render();
  const prompt=`You help Envoler Innovations, an Indian drone and UAV company, keep track of meetings with clients, government bodies, PSUs and partners.
Today is ${today()} (YYYY-MM-DD). The notes were written by ${myName()}. Team members: ${teamNames().join(", ")}.
Read the meeting notes and return ONLY a JSON object, no other text:
{"summary": "3 to 5 plain sentences on what was discussed and agreed",
 "decisions": ["short decision"],
 "followups": [{"task": "specific next step starting with a verb", "contact": "person it concerns", "org": "their organisation", "due": "YYYY-MM-DD", "owner": "team member name, or 'me' if the writer owns it"}]}
Resolve relative dates like "next Tuesday" against today. If no date is given for a follow-up, use ${addDays(today(),3)}. Include every promise, document to send, call to make, or meeting to set up. Do not invent commitments.
Meeting with: ${d.person||"unknown"} (${d.org||"unknown organisation"}), on ${d.date}.
Notes:
"""${d.notes.slice(0,40000)}"""`;
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.aiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:CFG.CLAUDE_MODEL,max_tokens:3000,messages:[{role:"user",content:prompt}]})});
    if(r.status===401) throw new Error("key");
    if(r.status===429) throw new Error("rate");
    if(!r.ok) throw new Error("http");
    const data=await r.json();
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").replace(/```json|```/g,"").trim();
    const out=JSON.parse(text.slice(text.indexOf("{"),text.lastIndexOf("}")+1));
    d.summary=String(out.summary||"");
    d.decisions=Array.isArray(out.decisions)?out.decisions.map(String).slice(0,12):[];
    const items=(Array.isArray(out.followups)?out.followups:[]).slice(0,20).map(f=>({
      task:String(f.task||""),contact:String(f.contact||d.person||""),org:String(f.org||d.org||""),
      due:/^\d{4}-\d{2}-\d{2}$/.test(f.due||"")?f.due:addDays(today(),3),owner:matchOwner(f.owner)})).filter(f=>f.task);
    d.items=d.items.concat(items); LS.set("draft",d);
    toast(items.length?`Found ${items.length} follow-up${items.length>1?"s":""}. Check them before saving.`:"No follow-ups found in these notes.");
  }catch(e){
    toast(e.message==="key"?"The Claude API key was rejected. Check it in Settings.":e.message==="rate"?"Too many requests. Wait a minute and try again.":"Couldn't read the notes. Try again, or add follow-ups by hand.");
  }
  S.busy=false; render();
}
async function saveMeeting(){
  captureDraft();
  const d=S.draft;
  if(!d.person.trim()&&!d.notes.trim()){ toast("Add who you met or some notes first."); return; }
  const meeting={id:uid(),date:d.date,person:d.person.trim(),org:d.org.trim(),summary:d.summary,decisions:d.decisions.join("\n"),notes:d.notes,createdBy:myName(),createdAt:Date.now(),docUrl:""};
  const followups=d.items.filter(it=>it.task.trim()).map(it=>({id:uid(),task:it.task.trim(),contact:(it.contact||meeting.person).trim(),org:(it.org||meeting.org).trim(),
    due:it.due||addDays(today(),3),owner:it.owner||myName(),status:"open",meetingId:meeting.id,createdBy:myName(),createdAt:Date.now(),doneAt:"",eventId:""}));
  queue({type:"meeting",meeting,followups,useCal:S.useCal});
  S.meetings.unshift(meeting); S.followups=S.followups.concat(followups);
  LS.set("cache",{meetings:S.meetings,followups:S.followups});
  S.draft=blankDraft(); LS.set("draft",S.draft);
  S.view=followups.length?"today":"meetings"; render();
  toast(S.online?"Saving to Google…":"Saved on this phone. It will sync when you're online.");
  if(S.online){ await flushOutbox(); render(); if(!S.outbox.length) toast(`Saved meeting${followups.length?` and ${followups.length} follow-up${followups.length>1?"s":""}`:""}.`); }
}
async function changeFollowup(id,act){
  const f=S.followups.find(x=>x.id===id); if(!f) return;
  const c=Object.assign({},f); let calMove=false;
  if(act==="done"){ c.status="done"; c.doneAt=String(Date.now()); }
  if(act==="reopen"){ c.status="open"; c.doneAt=""; }
  if(act==="snooze"){ c.due=addDays(f.due<today()?today():f.due,3); calMove=true; }
  Object.assign(f,c); LS.set("cache",{meetings:S.meetings,followups:S.followups});
  const queued=S.outbox.find(o=>o.type==="meeting"&&!o.rowsDone&&o.followups.some(x=>x.id===id));
  if(queued){ Object.assign(queued.followups.find(x=>x.id===id),c); LS.set("outbox",S.outbox); }
  else queue({type:"followup",f:c,calMove});
  render();
  toast(act==="done"?"Marked done.":act==="reopen"?"Reopened.":"Moved 3 days later.");
  if(S.online){ await flushOutbox(); render(); }
}

/* ---------- dictation ---------- */
let rec=null;
function toggleDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
  if(S.recording&&rec){ rec.stop(); return; }
  captureDraft();
  try{
    rec=new SR(); rec.lang="en-IN"; rec.continuous=true; rec.interimResults=false;
    rec.onresult=e=>{ let t=""; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) t+=e.results[i][0].transcript+" "; }
      if(t){ const ta=$("#notes"); const cur=ta?ta.value:S.draft.notes; S.draft.notes=cur+(cur&&!/\s$/.test(cur)?" ":"")+t; if(ta) ta.value=S.draft.notes; LS.set("draft",S.draft); } };
    rec.onerror=e=>{ S.recording=false; render(); toast(e.error==="not-allowed"||e.error==="service-not-allowed"?"Microphone access is blocked. Allow it in your phone settings, or use the keyboard mic.":"Dictation stopped. Use the keyboard mic if it keeps failing."); };
    rec.onend=()=>{ S.recording=false; render(); };
    rec.start(); S.recording=true; render();
  }catch(e){ S.recording=false; toast("Dictation isn't available here. Use the mic on your keyboard instead."); }
}

/* ---------- events ---------- */
let saveT;
document.addEventListener("input",e=>{
  if(e.target.id==="pq"){ S.peopleQ=e.target.value; render(); return; }
  if(S.view==="log"){ clearTimeout(saveT); saveT=setTimeout(captureDraft,400); }
});
document.addEventListener("change",e=>{
  if(e.target.id==="useCal"||e.target.id==="useCal2"){ S.useCal=e.target.checked; LS.set("useCal",S.useCal); }
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.v){ if(S.view==="log") captureDraft(); S.view=t.dataset.v; render(); window.scrollTo(0,0); return; }
  if(t.dataset.scope){ S.scope=t.dataset.scope; render(); return; }
  switch(t.id){
    case "signIn": return signIn(false);
    case "signOut": return signOut();
    case "refresh": toast("Refreshing…"); return sync();
    case "syncNow": return sync();
    case "openSettings": S.view="settings"; render(); window.scrollTo(0,0); return;
    case "back": S.view="today"; render(); return;
    case "extract": return extract();
    case "dictate": return toggleDictation();
    case "addItem": captureDraft(); S.draft.items.push({task:"",contact:S.draft.person,org:S.draft.org,due:addDays(today(),3),owner:myName()}); render(); return;
    case "saveMeeting": return saveMeeting();
    case "clearDraft": if(confirm("Clear this draft? The notes will be lost.")){ S.draft=blankDraft(); LS.set("draft",S.draft); render(); } return;
    case "saveKey": S.aiKey=$("#aiKey").value.trim(); LS.set("aiKey",S.aiKey); toast(S.aiKey?"Key saved on this phone.":"Key removed."); render(); return;
    case "clearKey": S.aiKey=""; LS.del("aiKey"); toast("Key removed."); render(); return;
    case "install": if(S.installEvt){ S.installEvt.prompt(); S.installEvt=null; render(); } return;
    case "hideInstall": LS.set("hideInstall",true); render(); return;
  }
  if(t.dataset.rm!=null){ captureDraft(); S.draft.items.splice(+t.dataset.rm,1); LS.set("draft",S.draft); render(); return; }
  if(t.dataset.newfor!=null){ S.draft=Object.assign(blankDraft(),{person:t.dataset.newfor,org:t.dataset.neworg}); LS.set("draft",S.draft); S.view="log"; render(); window.scrollTo(0,0); return; }
  const row=t.closest(".row"); if(row&&t.dataset.act) return changeFollowup(row.dataset.id,t.dataset.act);
});
window.addEventListener("online",()=>{ S.online=true; render(); sync(); });
window.addEventListener("offline",()=>{ S.online=false; render(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && Date.now()-S.lastLoad>60000){ if(tokenOk()) sync(); } });
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); S.installEvt=e; render(); });

/* ---------- start ---------- */
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
readRedirect();
render();
if(tokenOk()) loadAll();
else if(S.me && navigator.onLine && !returnedFromGoogle) signIn(true);
})();
</script>
